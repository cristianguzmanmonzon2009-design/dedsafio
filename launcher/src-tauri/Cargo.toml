[package]
name = "dedsafio-launcher"
version = "0.1.0"
description = "Launcher privado Dedsafio (Minecraft 1.21.1 + Fabric)"
authors = ["Dedsafio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dedsafio_launcher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "3", features = ["windows-native"] }
dirs = "5"
sysinfo = "0.32"
md5 = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
