# Blueprint de Render para el backend Dedsafio.
# Despliegue: https://render.com -> New -> Blueprint -> selecciona este repo.
# Los valores con `sync: false` se rellenan a mano en el panel (secretos).
services:
  - type: web
    name: dedsafio-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0

      # Base de datos (Neon / Render Postgres). Copia la cadena de conexión.
      - key: DATABASE_URL
        sync: false

      # Secretos: los MISMOS que en tu backend/.env local.
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: LICENSE_TOKEN_SECRET
        sync: false
      - key: DOWNLOAD_URL_SECRET
        sync: false
      - key: SIGNING_PRIVATE_KEY_PEM_B64
        sync: false
      - key: SIGNING_PUBLIC_KEY_PEM_B64
        sync: false
      - key: MOD_MASTER_KEY_B64
        sync: false

      # Servidor de Minecraft
      - key: SERVER_ID
        value: endersafio
      - key: SERVER_NAME
        value: EnderSAFIO
      - key: SERVER_HOST
        value: s10.mia.us.tarohosting.lat
      - key: SERVER_PORT
        value: "33538"
      - key: MINECRAFT_VERSION
        value: "1.21.1"
      - key: FABRIC_LOADER_VERSION
        value: "0.16.5"
      - key: REQUIRED_JAVA_MAJOR
        value: "21"

      # Artefactos cifrados servidos desde assets de un GitHub Release.
      - key: STORAGE_DRIVER
        value: http
      - key: MODS_BASE_URL
        value: https://github.com/cristianguzmanmonzon2009-design/dedsafio/releases/download/mods-v1

      - key: CORS_ORIGINS
        value: tauri://localhost

      - key: SEED_ADMIN_USERNAME
        value: admin
      - key: SEED_ADMIN_EMAIL
        value: admin@example.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
